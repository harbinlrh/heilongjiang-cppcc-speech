interface:
  display_name: "全国社情民意、提案与咨政报告 Word"
  short_description: "首段事实先行、末句建议，数据实例讲清问题，段数段长自然变化，三至四条对策，核验Word与邮件"
  default_prompt: "请使用 $national-social-opinion-word，按已确认文体撰写全国稿。第一自然段先写事实、通俗概念和矛盾，最后一句才提出总体建议；默认不设摘要。问题分析用可核实数据和真实案例讲清发生机制、制度断点与实际影响，让非专业读者能看懂；不同问题小标题下按需要写一至三段，段数有差异，各段字数自然有长有短，不统一段式或均分篇幅。建议三至四条，聚焦独立制度动作并核对权限。正文直接写数据和实例，保留时间、范围及争议状态，出处留内部记录。沿用已授权署名和基本版式生成并检查全部页面；本次要求邮件交付时核对发件账号，发送至指定邮箱（默认917935736@qq.com），并独立核验已发送记录和附件。"
